{% extends 'base.html' %}

{% block title %}Password Reset Complete – ReFind Campus{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-card-bg rounded-3xl border border-border p-8 sm:p-10 shadow-hover text-center space-y-6">
        
        <div class="w-16 h-16 rounded-3xl bg-light-green text-primary-green flex items-center justify-center mx-auto shadow-sm">
            <i data-lucide="check-circle-2" class="w-9 h-9"></i>
        </div>

        <div>
            <h1 class="text-2xl font-extrabold text-main-text font-heading">Password Changed!</h1>
            <p class="text-xs text-secondary-text mt-2 leading-relaxed">
                Your password has been successfully updated. You may now log in using your new credentials.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'accounts:login' %}" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-primary-green text-white font-semibold text-xs hover:bg-dark-green transition shadow-sm">
                <span>Log In Now</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
        </div>
    </div>
</div>
{% endblock %}
