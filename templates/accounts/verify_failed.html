{% extends 'base.html' %}

{% block title %}Verification Failed – ReFind{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-card-bg rounded-3xl border border-border p-8 sm:p-10 shadow-hover text-center space-y-6">
        <div class="w-16 h-16 rounded-3xl bg-red-50 text-status-error flex items-center justify-center mx-auto shadow-sm">
            <i data-lucide="alert-octagon" class="w-8 h-8"></i>
        </div>
        <div>
            <h1 class="text-2xl font-extrabold text-main-text font-heading">Verification Link Invalid</h1>
            <p class="text-xs text-secondary-text mt-2 leading-relaxed">
                This verification token may have expired or already been used. Please log into your account to generate a new verification email.
            </p>
        </div>
        <div class="pt-4 border-t border-border">
            <a href="{% url 'accounts:login' %}" class="inline-block px-6 py-3 rounded-xl bg-primary-green text-white font-semibold text-xs hover:bg-dark-green transition">
                Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
